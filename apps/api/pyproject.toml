[project]
name = "skillsignal-api"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
	"alembic>=1.17",
	"asyncpg>=0.30.0",
	"bcrypt>=4.3.0",
	"fastapi>=0.116.1",
	"opentelemetry-exporter-otlp-proto-http>=1.44.0",
	"opentelemetry-instrumentation-fastapi>=0.65b0",
	"opentelemetry-instrumentation-sqlalchemy>=0.65b0",
	"opentelemetry-sdk>=1.44.0",
	"pydantic>=2.13.4",
	"pyjwt>=2.10.1",
	"python-multipart>=0.0.32",
	"sqlalchemy[asyncio]>=2.0.42",
	"starlette>=1.6.0",
	"uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
	"aiosqlite>=0.22.1",
	"httpx>=0.28.1",
	"pyright[nodejs]>=1.1.403",
	"pytest>=8.4.1",
	"pytest-asyncio>=1.1.0",
	"ruff>=0.12.9",
]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
reportUnusedFunction = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
