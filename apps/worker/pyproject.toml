[project]
name = "resume-screener-worker"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
	"asyncpg>=0.30.0",
	"pypdf>=6.16.1",
	"sqlalchemy[asyncio]>=2.0.42",
]

[dependency-groups]
dev = [
	"pyright[nodejs]>=1.1.403",
	"pytest>=8.4.1",
	"pytest-asyncio>=1.1.0",
	"ruff>=0.12.9",
]

[tool.pyright]
include = ["worker", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
