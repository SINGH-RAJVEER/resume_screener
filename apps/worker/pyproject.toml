[project]
name = "skillsignal-worker"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
	"asyncpg>=0.30.0",
	"httpx>=0.28.1",
	"opentelemetry-exporter-otlp-proto-http>=1.44.0",
	"opentelemetry-instrumentation-httpx>=0.65b0",
	"opentelemetry-instrumentation-sqlalchemy>=0.65b0",
	"opentelemetry-sdk>=1.44.0",
	"pydantic>=2.13.4",
	"pypdf>=6.16.1",
	"python-docx>=1.2.0",
	"sqlalchemy[asyncio]>=2.0.42",
]

[dependency-groups]
dev = [
	"pyright[nodejs]>=1.1.403",
	"pytest>=8.4.1",
	"pytest-asyncio>=1.1.0",
	"ruff>=0.12.9",
]

[tool.pyright]
include = ["worker", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
