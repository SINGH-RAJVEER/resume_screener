name: skillsignal

services:
    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-skillsignal}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skillsignal}"]
            interval: 10s
            timeout: 3s
            retries: 5

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        restart: unless-stopped
        ports:
            - "8000:8000"
        environment:
            DATABASE_HOST: postgres
            DATABASE_PORT: 5432
            DATABASE_NAME: ${POSTGRES_DB:-skillsignal}
            DATABASE_USER: ${POSTGRES_USER:-postgres}
            DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
            WEB_URL: ${WEB_URL:-http://localhost:3000}
            JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
            JWT_TTL: ${JWT_TTL:-168h}
            STORAGE_ROOT: /var/resume-storage
            POINTS_PER_USD: ${POINTS_PER_USD:-1000}
            MIN_POINTS_INDEPENDENT_EVALUATION: ${MIN_POINTS_INDEPENDENT_EVALUATION:-10}
            MIN_POINTS_EMPLOYER_RESUME: ${MIN_POINTS_EMPLOYER_RESUME:-5}
            PRICE_CEILING_INPUT_USD_PER_MILLION: ${PRICE_CEILING_INPUT_USD_PER_MILLION:-3.0}
            PRICE_CEILING_OUTPUT_USD_PER_MILLION: ${PRICE_CEILING_OUTPUT_USD_PER_MILLION:-15.0}
            RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
            RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
            RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
            RAZORPAY_PACKS: ${RAZORPAY_PACKS:-}
            ADMIN_TOKEN: ${ADMIN_TOKEN:-}
            ENTERPRISE_SALES_EMAIL: ${ENTERPRISE_SALES_EMAIL:-}
            OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
            OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
        volumes:
            - resume_storage:/var/resume-storage
        depends_on:
            postgres:
                condition: service_healthy

    worker:
        build:
            context: .
            dockerfile: apps/worker/Dockerfile
        restart: unless-stopped
        read_only: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        tmpfs:
            - /tmp:size=64m,noexec,nosuid,nodev
        environment:
            DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-skillsignal}
            STORAGE_ROOT: /var/resume-storage
            WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
            WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
            PARSE_TIMEOUT_SECONDS: ${PARSE_TIMEOUT_SECONDS:-30}
            POINTS_PER_USD: ${POINTS_PER_USD:-1000}
            MIN_POINTS_INDEPENDENT_EVALUATION: ${MIN_POINTS_INDEPENDENT_EVALUATION:-10}
            MIN_POINTS_EMPLOYER_RESUME: ${MIN_POINTS_EMPLOYER_RESUME:-5}
            PRICE_CEILING_INPUT_USD_PER_MILLION: ${PRICE_CEILING_INPUT_USD_PER_MILLION:-3.0}
            PRICE_CEILING_OUTPUT_USD_PER_MILLION: ${PRICE_CEILING_OUTPUT_USD_PER_MILLION:-15.0}
            OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
            OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
            OPENROUTER_EXTRACTION_MODEL: ${OPENROUTER_EXTRACTION_MODEL:-}
            OPENROUTER_ASSESSMENT_MODEL: ${OPENROUTER_ASSESSMENT_MODEL:-}
            OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-}
            OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-}
            OPENROUTER_MAX_OUTPUT_TOKENS: ${OPENROUTER_MAX_OUTPUT_TOKENS:-}
            OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
            OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
        volumes:
            - resume_storage:/var/resume-storage
        deploy:
            resources:
                limits:
                    cpus: "1"
                    memory: 512M
        depends_on:
            postgres:
                condition: service_healthy

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
            args:
                VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        restart: unless-stopped
        ports:
            - "3000:3000"

volumes:
    postgres_data:
    resume_storage:
